
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roboshop
   # these are replica set labels
  labels:
    project: roboshop
    component: frontend
    tier: frontend

spec:
  replicas: 1
  selector:
    # these labels are used to select pods
    matchLabels:
       project: roboshop
       component: frontend
       tier: frontend
  template:
    metadata:
    ## pod labels
      labels:
       project: roboshop
       component: frontend
       tier: frontend
    spec:
      containers:
      - name: frontend
        image: venkatsai12345/frontend:v1
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: frontend
        readinessProbe:
           httpGet:
             path: /
             port: 80
           failureThreshold: 1
           periodSeconds: 10
        livenessProbe:
           httpGet:
              path: /
              port: 80
           failureThreshold: 1
           periodSeconds: 10
            
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
spec:
  type: LoadBalancer
  selector:
    project: roboshop
    component: frontend
    tier: frontend

  ports:
    - protocol: TCP
      port: 80 ## service port
      targetPort: 8080 ## container port

